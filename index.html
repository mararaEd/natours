    <title>Document</title>

  <body>
    <script>
      const firstPromise = new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve('hello');
        }, 1500);
      });

      const secondPromise = new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve('hi');
        }, 3000);
      });

      (async () => {
        const letsLook = await firstPromise;
        console.log(letsLook);

        const letsLook2 = await secondPromise;
        console.log(letsLook2);
      })();
    </script>
  </body>
